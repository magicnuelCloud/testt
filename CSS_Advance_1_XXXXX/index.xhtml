<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Mahasiswa</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div id="container">
        <div class="page-header">
            <p class="eyebrow">FORMULIR AKADEMIK</p>
            <h1>Registrasi Mahasiswa</h1>
            <p class="intro">Lengkapi informasi berikut untuk melengkapi data pendaftaran mahasiswa.</p>
        </div>

        <form action="" method="post" enctype="multipart/form-data">
            <table>
                <tr class="section-row">
                    <th colspan="2">Data Pribadi</th>
                </tr>
                <tr>
                    <td class="field-name"><label for="namamhs">Nama Mahasiswa</label></td>
                    <td><input type="text" id="namamhs" name="namamhs" size="30" /></td>
                </tr>
                <tr>
                    <td class="field-name">Jenis Kelamin</td>
                    <td class="choice-group">
                        <input type="radio" id="laki" name="jk" value="Laki-laki" />
                        <label for="laki">Laki-laki</label>
                        <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                        <label for="perempuan">Perempuan</label>
                    </td>
                </tr>
                <tr>
                    <td class="field-name"><label for="email">Alamat Email</label></td>
                    <td><input type="text" id="email" name="email" size="30" /></td>
                </tr>
                <tr>
                    <td class="field-name"><label for="telepon">Nomor Telepon</label></td>
                    <td><input type="text" id="telepon" name="telepon" size="30" /></td>
                </tr>
                <tr>
                    <td class="field-name"><label for="password">Password</label></td>
                    <td><input type="password" id="password" name="password" size="30" /></td>
                </tr>
                <tr>
                    <td class="field-name"><label for="photo">Foto Mahasiswa</label></td>
                    <td><input type="file" id="photo" name="photo" accept="image/gif, image/jpeg, image/png" /></td>
                </tr>

                <tr class="section-row">
                    <th colspan="2">Data Pendidikan</th>
                </tr>
                <tr>
                    <td class="field-name"><label for="prodi">Program Studi</label></td>
                    <td>
                        <select id="prodi" name="prodi">
                            <option value="Informatika">Informatika</option>
                            <option value="Sistem Informasi">Sistem Informasi</option>
                            <option value="Teknik Komputer">Teknik Komputer</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="field-name"><label for="namasmu">Asal Sekolah</label></td>
                    <td><input type="text" id="namasmu" name="namasmu" size="30" /></td>
                </tr>

                <tr class="section-row">
                    <th colspan="2">Tentang Dirimu</th>
                </tr>
                <tr>
                    <td class="field-name">Hal Favorit</td>
                    <td>
                        <div class="favorite-group">
                            <p class="group-title">Musik yang disukai</p>
                            <input type="checkbox" id="musik1" name="musik" value="Pop" />
                            <label for="musik1">Pop</label>
                            <input type="checkbox" id="musik2" name="musik" value="Rock" />
                            <label for="musik2">Rock</label>
                            <input type="checkbox" id="musik3" name="musik" value="Jazz" />
                            <label for="musik3">Jazz</label>
                        </div>
                        <div class="favorite-group">
                            <p class="group-title">Genre film favorit</p>
                            <input type="checkbox" id="film1" name="film" value="Drama" />
                            <label for="film1">Drama</label>
                            <input type="checkbox" id="film2" name="film" value="Action" />
                            <label for="film2">Action</label>
                            <input type="checkbox" id="film3" name="film" value="Sci-Fi" />
                            <label for="film3">Sci-Fi</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="field-name"><label for="resume">Perkenalan Singkat</label></td>
                    <td>
                        <textarea id="resume" name="resume" rows="6" cols="30">Ceritakan sedikit tentang dirimu, minat, atau tujuan kuliahmu.</textarea>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="submit-cell">
                        <input type="submit" name="simpan" value="Kirim Pendaftaran" />
                        <input type="reset" name="ulang" value="Kosongkan Form" />
                    </td>
                </tr>
            </table>
        </form>
        <p class="footer-note">Pastikan data yang kamu masukkan sudah benar sebelum mengirim formulir.</p>
    </div>
</body>
</html>
