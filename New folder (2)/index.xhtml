<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pendaftaran Mahasiswa Baru</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div class="halaman">
        <div class="header">
            <h1>Pendaftaran Mahasiswa Baru</h1>
            <p class="pengantar">Lengkapi data diri kamu di bawah ini dengan benar, lalu tekan tombol <em>Kirim Data</em>.</p>
        </div>

        <form action="" method="post" enctype="multipart/form-data">
            <table class="tabel-form">

                <tr>
                    <td class="kolom-label">
                        <label for="namamhs">Nama Lengkap</label>
                    </td>
                    <td>
                        <input type="text" id="namamhs" name="namamhs" size="30" />
                    </td>
                </tr>

                <tr>
                    <td class="kolom-label">Gender</td>
                    <td>
                        <input type="radio" id="laki" name="jk" value="Laki-laki" /><label for="laki" class="pilihan">Laki-laki</label>
                        <input type="radio" id="perempuan" name="jk" value="Perempuan" /><label for="perempuan" class="pilihan">Perempuan</label>
                    </td>
                </tr>

                <tr>
                    <td class="kolom-label">
                        <label for="prodi">Jurusan</label>
                    </td>
                    <td>
                        <select id="prodi" name="prodi">
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Komputer</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td class="kolom-label">
                        <label for="email">Email Aktif</label>
                    </td>
                    <td>
                        <input type="text" id="email" name="email" size="30" />
                    </td>
                </tr>

                <tr>
                    <td class="kolom-label">
                        <label for="telepon">No. HP</label>
                    </td>
                    <td>
                        <input type="text" name="telepon" id="telepon" size="30" />
                    </td>
                </tr>

                <tr>
                    <td class="kolom-label">
                        <label for="password">Kata Sandi</label>
                    </td>
                    <td>
                        <input type="password" id="password" name="password" size="30" />
                    </td>
                </tr>

                <tr>
                    <td class="kolom-label">
                        <label for="photo">Pas Foto</label>
                    </td>
                    <td>
                        <input type="file" id="photo" name="photo" size="18" accept="image/gif, image/jpeg, image/png" />
                    </td>
                </tr>

                <tr>
                    <td class="kolom-label">
                        <label for="namasmu">Asal Sekolah</label>
                    </td>
                    <td>
                        <input type="text" id="namasmu" name="namasmu" size="30" />
                    </td>
                </tr>

                <tr>
                    <td class="kolom-label atas">Minat &amp; Hobi</td>
                    <td>
                        <fieldset>
                            <legend>Genre musik</legend>
                            <input type="checkbox" id="musik1" name="musik" value="Pop" /><label for="musik1" class="pilihan">Pop</label>
                            <input type="checkbox" id="musik2" name="musik" value="Rock" /><label for="musik2" class="pilihan">Rock</label>
                            <input type="checkbox" id="musik3" name="musik" value="Jazz" /><label for="musik3" class="pilihan">Jazz</label>
                        </fieldset>
                        <fieldset>
                            <legend>Genre film</legend>
                            <input type="checkbox" id="film1" name="film" value="Drama" /><label for="film1" class="pilihan">Drama</label>
                            <input type="checkbox" id="film2" name="film" value="Action" /><label for="film2" class="pilihan">Action</label>
                            <input type="checkbox" id="film3" name="film" value="Sci-Fi" /><label for="film3" class="pilihan">Sci-Fi</label>
                        </fieldset>
                    </td>
                </tr>

                <tr>
                    <td class="kolom-label atas">
                        <label for="resume">Tentang Saya</label>
                    </td>
                    <td>
                        <textarea id="resume" name="resume" rows="8" cols="30"></textarea>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" class="aksi">
                        <input type="submit" name="simpan" value="Kirim Data" />
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
