<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daftar Seminar Teknologi</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div class="halaman">
        <div class="header">
            <h1>Daftar Seminar Teknologi</h1>
            <p class="pengantar">Isi tiga bagian di bawah ini, lalu kirim untuk mengamankan kursimu.</p>
        </div>

        <form action="" method="post" enctype="multipart/form-data">

            <div class="bagian">
                <h2>Identitas Peserta</h2>
                <table class="tabel-form">
                    <tr>
                        <td class="kolom-label"><label for="nama">Nama Peserta</label></td>
                        <td><input type="text" id="nama" name="nama" size="30" /></td>
                    </tr>
                    <tr>
                        <td class="kolom-label"><label for="nim">Nomor Induk Mahasiswa</label></td>
                        <td><input type="text" id="nim" name="nim" size="30" /></td>
                    </tr>
                    <tr>
                        <td class="kolom-label">Gender</td>
                        <td>
                            <input type="radio" id="laki" name="jk" value="Laki-Laki" /><label for="laki" class="pilihan">Laki-Laki</label>
                            <input type="radio" id="perempuan" name="jk" value="Perempuan" /><label for="perempuan" class="pilihan">Perempuan</label>
                        </td>
                    </tr>
                    <tr>
                        <td class="kolom-label"><label for="prodi">Jurusan</label></td>
                        <td>
                            <select id="prodi" name="prodi">
                                <option>Informatika</option>
                                <option>Sistem Informasi</option>
                                <option>Teknik Industri</option>
                            </select>
                        </td>
                    </tr>
                </table>
            </div>

            <div class="bagian">
                <h2>Pilih Seminar</h2>
                <table class="tabel-form">
                    <tr>
                        <td class="kolom-label">Kategori Tiket</td>
                        <td>
                            <input type="radio" id="reguler" name="tiket" value="Reguler" /><label for="reguler" class="pilihan">Reguler</label>
                            <input type="radio" id="vip" name="tiket" value="VIP" /><label for="vip" class="pilihan">VIP</label>
                        </td>
                    </tr>
                    <tr>
                        <td class="kolom-label atas">Tema yang Diminati</td>
                        <td>
                            <div class="kotak-pilihan">
                                <input type="checkbox" id="topik1" name="topik" value="Web Development" /><label for="topik1" class="pilihan">Web Development</label>
                            </div>
                            <div class="kotak-pilihan">
                                <input type="checkbox" id="topik2" name="topik" value="Data Science" /><label for="topik2" class="pilihan">Data Science</label>
                            </div>
                            <div class="kotak-pilihan">
                                <input type="checkbox" id="topik3" name="topik" value="Artificial Intelligence" /><label for="topik3" class="pilihan">Artificial Intelligence</label>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>

            <div class="bagian">
                <h2>Data Pendukung</h2>
                <table class="tabel-form">
                    <tr>
                        <td class="kolom-label atas"><label for="alasan">Motivasi Ikut Seminar</label></td>
                        <td><textarea id="alasan" name="alasan" rows="8" cols="30"></textarea></td>
                    </tr>
                    <tr>
                        <td class="kolom-label"><label for="bukti">Unggah Bukti Transfer</label></td>
                        <td><input type="file" id="bukti" name="bukti" size="18" accept="image/gif, image/jpeg, image/png" /></td>
                    </tr>
                </table>
            </div>

            <div class="aksi">
                <input type="submit" name="simpan" value="Daftar Sekarang" />
            </div>
        </form>
    </div>
</body>
</html>
